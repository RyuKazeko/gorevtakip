<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Kullanıcı - Görev Takip</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Yeni Kullanıcı - Kayıt</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="NewUserForm">
                    <div class="mb-3">
                        <label for="NewUserName" class="form-label">Ad</label>
                        <input type="text" class="form-control" id="NewUserName" required>
                    </div>
                    <div class="mb-3">
                        <label for="NewUserSurname" class="form-label">Soyad</label>
                        <input type="text" class="form-control" id="NewUserSurname" required>
                    </div>
                    <div class="mb-3">
                        <label for="NewUserEmail" class="form-label">E-posta</label>
                        <input type="email" class="form-control" id="NewUserEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="NewUserPassword" class="form-label">Şifre</label>
                        <input type="text" class="form-control" id="NewUserPassword" required>
                    </div>
                    <div class="mb-3">
                        <label for="NewUserConfirmPassword" class="form-label">Şifre Onayı</label>
                        <input type="text" class="form-control" id="NewUserConfirmPassword" required>
                    </div>
                    <button type="button" class="btn btn-primary" id="saveNewUserButton">Kaydet</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        function checkPassMatch() {
            if ($("#NewUserPassword").val() === $("#NewUserConfirmPassword").val()) {
                const user = {
                    NewUserName: $("#NewUserName").val(),
                    NewUserEmail: $("#NewUserEmail").val(),
                    NewUserPassword: $("#NewUserPassword").val(),
                };
                addUser(user);
            }
        }
        $("#saveNewUserButton").on("click", async function () {
            checkPassMatch()
        }

        );
        async function addUser(user) {
            await $.ajax({
                method: "POST",
                url: "../client/addNewUser.php",
                data: {
                    user: user
                },
                success: function (response) {
                    if (response === "exists") {
                        alert("Bu mail adresi sistemimize zaten kayıtlı");
                    } else {
                        alert(response)
                    }
                }
            })

        }
    </script>
</body>

</html>
